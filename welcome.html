<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#004d26">
  <meta name="description" content="Edelnuss Global Ltd — premium macadamia processed and exported from Meru, Kenya to the world.">
  <title>Welcome | Edelnuss Global Ltd</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    /* =========================================================
       Edelnuss welcome page
       Adjust these two brand colors and the timing variables to
       personalize the look and the deliberately slow reveal.
       ========================================================= */
    :root {
      --forest: #004d26;
      --forest-dark: #00361c;
      --forest-light: #0b693a;
      --gold: #d4a017;
      --cream: #fff9e9;
      --motion: 900ms;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--forest-dark);
    }

    body {
      position: relative;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      flex-direction: column;
      color: var(--cream);
      background: linear-gradient(130deg, var(--forest-dark), var(--forest), var(--forest-light), var(--forest));
      background-size: 280% 280%;
      animation: green-tide 34s ease-in-out infinite alternate;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Soft radial light and fine grain add depth without competing with the logo. */
    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(28, 111, 62, 0.4), transparent 53%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 4px);
      content: "";
      pointer-events: none;
    }

    .welcome-frame {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100%, 1440px);
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(28px, 5.5vh, 58px) clamp(22px, 5vw, 72px) 26px;
      flex: 1;
      flex-direction: column;
      align-items: center;
    }

    /* Quiet gold rules frame the welcome, like the edge of a fine label. */
    .welcome-frame::before,
    .welcome-frame::after {
      position: absolute;
      top: 50%;
      width: 1px;
      height: min(44vh, 390px);
      background: linear-gradient(transparent, rgba(212, 160, 23, 0.32), transparent);
      content: "";
      transform: translateY(-50%);
      pointer-events: none;
    }

    .welcome-frame::before { left: clamp(18px, 3vw, 46px); }
    .welcome-frame::after { right: clamp(18px, 3vw, 46px); }

    .welcome-content {
      display: flex;
      width: min(100%, 920px);
      margin: auto;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Keep the official square image intact; its built-in green background is part of the mark. */
    .brand-mark {
      display: block;
      width: clamp(128px, 18vw, 190px);
      height: auto;
      aspect-ratio: 1;
      border: 1px solid rgba(212, 160, 23, 0.72);
      background: #064524;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.22), 0 0 0 8px rgba(212, 160, 23, 0.045);
      object-fit: cover;
      opacity: 0;
      animation: mark-arrive 1.7s cubic-bezier(0.2, 0.7, 0.2, 1) 180ms forwards,
        mark-float 8s ease-in-out 2s infinite;
    }

    .eyebrow,
    .tagline,
    .welcome-actions,
    .welcome-footer {
      opacity: 0;
    }

    .eyebrow {
      margin: clamp(27px, 4vh, 40px) 0 14px;
      color: #ecd28a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: rise-in 1s ease-out 1.1s forwards;
    }

    .brand-title {
      margin: 0;
      color: var(--cream);
      font-size: clamp(2.6rem, 8.1vw, 6.1rem);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 1.03;
      text-wrap: balance;
    }

    .brand-title .letter {
      display: inline-block;
      color: var(--gold);
      opacity: 0;
      animation: letter-arrive 760ms cubic-bezier(0.2, 0.7, 0.2, 1) calc(1.55s + var(--letter) * 85ms) forwards;
    }

    .brand-title .title-word {
      display: inline-block;
      white-space: nowrap;
    }

    .tagline {
      width: min(100%, 670px);
      margin: 22px 0 0;
      color: rgba(255, 249, 233, 0.86);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.98rem, 2.1vw, 1.22rem);
      font-weight: 400;
      letter-spacing: 0.025em;
      line-height: 1.8;
      animation: tagline-arrive 1.25s cubic-bezier(0.2, 0.7, 0.2, 1) 3.8s forwards;
    }

    .welcome-actions {
      display: flex;
      margin-top: clamp(28px, 4.5vh, 42px);
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      animation: rise-in 900ms ease-out 4.9s forwards;
    }

    .welcome-button {
      display: inline-flex;
      min-width: 190px;
      min-height: 54px;
      padding: 14px 25px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      border-radius: 2px;
      color: #12381f;
      background: var(--gold);
      box-shadow: 0 0 0 rgba(212, 160, 23, 0);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-decoration: none;
      transition: color 350ms ease, background-color 350ms ease, box-shadow 350ms ease, transform 350ms ease;
      opacity: 0;
      animation: button-arrive 850ms ease-out 5.25s forwards,
        button-glow 1.35s ease-out 6.05s 1 both;
    }

    .welcome-button:hover,
    .welcome-button:focus-visible {
      color: var(--cream);
      background: transparent;
      box-shadow: 0 0 24px rgba(212, 160, 23, 0.22);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .welcome-button:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 4px;
    }

    .welcome-button--outline {
      color: var(--cream);
      background: rgba(0, 30, 14, 0.08);
      animation-delay: 5.75s, 6.55s;
    }

    .welcome-button--outline:hover,
    .welcome-button--outline:focus-visible {
      color: #12381f;
      background: var(--gold);
    }

    .welcome-footer {
      width: 100%;
      padding-top: 28px;
      color: rgba(255, 249, 233, 0.74);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      line-height: 1.8;
      text-align: center;
      animation: footer-arrive 1s ease-out 6.05s forwards;
    }

    .welcome-footer a {
      color: inherit;
      text-decoration-color: rgba(212, 160, 23, 0.55);
      text-underline-offset: 3px;
      transition: color 250ms ease;
    }

    .welcome-footer a:hover { color: #f0d27e; }

    /* Thin CSS-only illustrations: oval kernels and softly outlined leaves. */
    .ornament {
      position: fixed;
      z-index: 0;
      width: 76px;
      height: 102px;
      border: 1px solid rgba(212, 160, 23, 0.15);
      border-radius: 52% 48% 50% 50% / 42% 44% 56% 58%;
      pointer-events: none;
      animation: ornament-drift 19s ease-in-out infinite;
    }

    .ornament::before,
    .ornament::after {
      position: absolute;
      display: block;
      content: "";
      pointer-events: none;
    }

    .ornament::before {
      top: 18%;
      left: 12%;
      width: 68%;
      height: 45%;
      border: 1px solid rgba(212, 160, 23, 0.14);
      border-radius: 100% 0 100% 0;
      transform: rotate(-28deg);
    }

    .ornament::after {
      top: 52%;
      left: 49%;
      width: 1px;
      height: 31%;
      background: rgba(212, 160, 23, 0.13);
      transform: rotate(34deg);
      transform-origin: top;
    }

    .ornament--left {
      top: 22%;
      left: 14%;
      transform: rotate(-23deg);
      animation-delay: -6s;
    }

    .ornament--right {
      right: 14%;
      bottom: 19%;
      width: 56px;
      height: 76px;
      transform: rotate(28deg);
      animation-delay: -13s;
    }

    .side-leaf {
      position: fixed;
      z-index: 0;
      width: 45px;
      height: 24px;
      border: 1px solid rgba(212, 160, 23, 0.13);
      border-radius: 100% 0 100% 0;
      pointer-events: none;
      animation: leaf-drift 17s ease-in-out infinite;
    }

    .side-leaf::after {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 84%;
      height: 1px;
      background: rgba(212, 160, 23, 0.12);
      content: "";
      transform: rotate(-18deg);
    }

    .side-leaf--one { top: 63%; left: 8%; transform: rotate(-24deg); animation-delay: -9s; }
    .side-leaf--two { top: 34%; right: 8%; transform: rotate(36deg); animation-delay: -2s; }

    /* Screen-reader heading stays readable while its visual letters reveal in sequence. */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes green-tide {
      from { background-position: 0% 45%; }
      to { background-position: 100% 55%; }
    }

    @keyframes mark-arrive {
      from { opacity: 0; transform: translateY(13px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes mark-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(17px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes letter-arrive {
      from { opacity: 0; transform: translateY(13px); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes tagline-arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes button-arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes button-glow {
      0%, 100% { box-shadow: 0 0 0 rgba(212, 160, 23, 0); }
      45% { box-shadow: 0 0 26px rgba(212, 160, 23, 0.42), 0 0 54px rgba(212, 160, 23, 0.12); }
    }

    @keyframes footer-arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ornament-drift {
      0%, 100% { translate: 0 0; rotate: -5deg; }
      50% { translate: 7px -18px; rotate: 5deg; }
    }

    @keyframes leaf-drift {
      0%, 100% { translate: 0 0; rotate: 0deg; }
      50% { translate: -8px -14px; rotate: 8deg; }
    }

    @media (max-width: 600px) {
      .welcome-frame { padding: 28px 22px 19px; }
      .welcome-frame::before,
      .welcome-frame::after { height: 36vh; }
      .brand-mark { width: clamp(118px, 34vw, 154px); }
      .eyebrow { margin-top: 28px; font-size: 0.62rem; letter-spacing: 0.22em; }
      .brand-title { max-width: 10ch; font-size: clamp(2.55rem, 12vw, 4.1rem); }
      .tagline { max-width: 32ch; margin-top: 19px; font-size: 0.97rem; line-height: 1.7; }
      .welcome-actions { width: min(100%, 330px); margin-top: 27px; flex-direction: column; gap: 11px; }
      .welcome-button { width: 100%; min-height: 52px; }
      .welcome-footer { padding-top: 24px; font-size: 0.72rem; }
      .ornament--left { top: 14%; left: -22px; scale: 0.75; }
      .ornament--right { right: -15px; bottom: 20%; scale: 0.8; }
      .side-leaf--one { left: -8px; }
      .side-leaf--two { right: -8px; }
    }

    /* Compact vertical spacing for short phones; longer devices can scroll naturally. */
    @media (max-width: 600px) and (max-height: 650px) {
      .welcome-frame { padding-top: 16px; padding-bottom: 12px; }
      .brand-mark { width: 100px; }
      .eyebrow { margin-top: 17px; margin-bottom: 8px; }
      .brand-title { font-size: clamp(2.35rem, 11vw, 3.2rem); }
      .tagline { margin-top: 12px; font-size: 0.9rem; line-height: 1.55; }
      .welcome-actions { margin-top: 17px; gap: 9px; }
      .welcome-button { min-height: 46px; padding-block: 10px; }
      .welcome-footer { padding-top: 13px; font-size: 0.68rem; }
    }

    @media (max-height: 700px) and (min-width: 601px) {
      .welcome-frame { padding-top: 25px; padding-bottom: 18px; }
      .brand-mark { width: 118px; }
      .eyebrow { margin-top: 20px; }
      .tagline { margin-top: 15px; }
      .welcome-actions { margin-top: 22px; }
      .welcome-footer { padding-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .brand-mark,
      .eyebrow,
      .brand-title .letter,
      .tagline,
      .welcome-actions,
      .welcome-button,
      .welcome-footer {
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <!-- Fine-line macadamia and leaf shapes form a faint, CSS-drawn backdrop. -->
  <span class="ornament ornament--left" aria-hidden="true"></span>
  <span class="ornament ornament--right" aria-hidden="true"></span>
  <span class="side-leaf side-leaf--one" aria-hidden="true"></span>
  <span class="side-leaf side-leaf--two" aria-hidden="true"></span>

  <div class="welcome-frame">
    <main class="welcome-content">
      <!-- Official logo supplied for the company; keep the square artwork uncropped. -->
      <img class="brand-mark" src="images/logo.png" alt="Edelnuss Global Ltd official logo">
      <p class="eyebrow">Meru, Kenya · Quality for the world</p>

      <!-- Each character reveals in sequence; the accessible name is provided once. -->
      <h1 class="brand-title" aria-label="Edelnuss Global Ltd">
        <span class="visually-hidden">Edelnuss Global Ltd</span>
        <span aria-hidden="true">
          <span class="title-word"><span class="letter" style="--letter: 0">E</span><span class="letter" style="--letter: 1">d</span><span class="letter" style="--letter: 2">e</span><span class="letter" style="--letter: 3">l</span><span class="letter" style="--letter: 4">n</span><span class="letter" style="--letter: 5">u</span><span class="letter" style="--letter: 6">s</span></span>
          <span class="title-word"><span class="letter" style="--letter: 8">G</span><span class="letter" style="--letter: 9">l</span><span class="letter" style="--letter: 10">o</span><span class="letter" style="--letter: 11">b</span><span class="letter" style="--letter: 12">a</span><span class="letter" style="--letter: 13">l</span></span>
          <span class="title-word"><span class="letter" style="--letter: 15">L</span><span class="letter" style="--letter: 16">t</span><span class="letter" style="--letter: 17">d</span></span>
        </span>
      </h1>

      <p class="tagline">Premium Macadamia Processed &amp; Exported From Kenya to the World</p>

      <nav class="welcome-actions" aria-label="Welcome navigation">
        <!-- ?site=1 opens the main homepage without triggering its welcome redirect. -->
        <a class="welcome-button" href="index.html?site=1">Enter Our Site <span aria-hidden="true">&nbsp;→</span></a>
        <a class="welcome-button welcome-button--outline" href="about.html">Learn More</a>
      </nav>
    </main>

    <footer class="welcome-footer">
      P.O. BOX 2538 - 60200 Meru, Kenya <span aria-hidden="true">|</span>
      <a href="mailto:info@edelnuss.co.ke">info@edelnuss.co.ke</a>
    </footer>
  </div>
</body>
</html>
